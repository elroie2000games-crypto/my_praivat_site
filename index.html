<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>הפרויקטים של אלרואי</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(-45deg,#020617,#1e3a8a,#2563eb,#38bdf8);

    background-size:400% 400%;

    animation:bg 15s infinite;

    color:white;

}


@keyframes bg{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


.stars{

    position:fixed;
    inset:0;

    background-image:
    radial-gradient(white 1px,transparent 1px);

    background-size:40px 40px;

    opacity:.2;

}



/* HEADER */

header{

    position:relative;

    text-align:center;

    padding:60px 20px;

}


header h1{

    font-size:50px;

    margin-bottom:15px;

}


header p{

    font-size:22px;

    opacity:.8;

    margin-bottom:30px;

}



/* SETTINGS */

.settings{

    position:absolute;

    top:25px;

    right:30px;

    font-size:32px;

    cursor:pointer;

    user-select:none;

}



.settings-menu{

    display:none;

    position:absolute;

    right:0;

    top:45px;

    width:180px;

    background:rgba(0,0,0,.9);

    border-radius:15px;

    overflow:hidden;

    box-shadow:0 10px 30px rgba(0,0,0,.4);

    z-index:100;

}



.settings-menu button{

    width:100%;

    padding:15px;

    background:none;

    border:none;

    color:white;

    cursor:pointer;

    font-size:17px;

}


.settings-menu button:hover{

    background:#2563eb;

}



/* BACK BUTTON */

.back{

    display:inline-block;

    background:white;

    color:#1e3a8a;

    padding:12px 25px;

    border-radius:15px;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;

}


.back:hover{

    transform:scale(1.05);

}



/* PROJECTS */


.projects{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));

    gap:35px;

    max-width:1100px;

    margin:auto;

    padding:40px;

}



.card{

    background:
    rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    border:
    1px solid rgba(255,255,255,.2);

    padding:30px;

    border-radius:25px;

    text-align:center;

    box-shadow:
    0 20px 40px rgba(0,0,0,.3);

    transition:.3s;

}


.card:hover{

    transform:translateY(-12px);

}



.card h2{

    font-size:32px;

    margin-bottom:15px;

}


.card p{

    font-size:18px;

    margin-bottom:25px;

}


.card a{

    display:inline-block;

    background:#2563eb;

    color:white;

    padding:14px 25px;

    border-radius:12px;

    text-decoration:none;

    font-weight:bold;

}


.card a:hover{

    background:#38bdf8;

}



footer{

    text-align:center;

    padding:50px;

    opacity:.8;

}


</style>

</head>


<body>


<div class="stars"></div>



<header>


<div class="settings" onclick="toggleSettings(event)">

⚙️


<div class="settings-menu" id="settingsMenu">


<button onclick="setLanguage('he')">

🇮🇱 עברית

</button>


<button onclick="setLanguage('en')">

🇺🇸 English

</button>


</div>


</div>




<h1 id="title">

🚀 הפרויקטים שלי

</h1>


<p id="subtitle">

כל האתרים והמשחקים שבניתי

</p>



<a class="back" id="back"
href="https://elroie2000games-crypto.github.io">

⬅ חזרה לאתר הראשי

</a>


</header>





<section class="projects">


<div class="card">

<h2>
👟 FlyStep
</h2>


<p id="flyText">

אתר הנעליים המעופפות.

</p>


<a href="https://elroie2000games-crypto.github.io/Fly_Step/"
target="_blank"
id="open1">

פתח את האתר 🚀

</a>


</div>





<div class="card">


<h2>
🐍 Python Studio
</h2>


<p id="pythonText">

עורך Python בדפדפן.

</p>


<a href="https://elroie2000games-crypto.github.io/Python-site/"
target="_blank"
id="open2">

פתח את האתר 🚀

</a>


</div>



</section>




<footer id="footer">

נבנה על ידי אלרואי ❤️

</footer>





<script>


function toggleSettings(event){

event.stopPropagation();


let menu=document.getElementById("settingsMenu");


if(menu.style.display==="block"){

menu.style.display="none";

}

else{

menu.style.display="block";

}


}



document.addEventListener("click",function(){

document.getElementById("settingsMenu").style.display="none";

});





const translations={


he:{


title:"🚀 הפרויקטים שלי",

subtitle:"כל האתרים והמשחקים שבניתי",

back:"⬅ חזרה לאתר הראשי",

fly:"אתר הנעליים המעופפות.",

python:"עורך Python בדפדפן.",

open:"פתח את האתר 🚀",

footer:"נבנה על ידי אלרואי ❤️"


},



en:{


title:"🚀 My Projects",

subtitle:"All websites and games I built",

back:"⬅ Back to main website",

fly:"The flying shoes website.",

python:"Python editor in the browser.",

open:"Open Website 🚀",

footer:"Created by Elroie ❤️"


}


};





function setLanguage(lang){


document.documentElement.lang=lang;


if(lang==="he"){

document.documentElement.dir="rtl";

}

else{

document.documentElement.dir="ltr";

}



document.getElementById("title").innerHTML =
translations[lang].title;


document.getElementById("subtitle").innerHTML =
translations[lang].subtitle;


document.getElementById("back").innerHTML =
translations[lang].back;


document.getElementById("flyText").innerHTML =
translations[lang].fly;


document.getElementById("pythonText").innerHTML =
translations[lang].python;


document.getElementById("open1").innerHTML =
translations[lang].open;


document.getElementById("open2").innerHTML =
translations[lang].open;


document.getElementById("footer").innerHTML =
translations[lang].footer;



localStorage.setItem("language",lang);


}




let savedLanguage =
localStorage.getItem("language") || "he";


setLanguage(savedLanguage);



console.log("Projects Portfolio Loaded 🚀");


</script>


</body>

</html>
