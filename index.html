<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(-45deg,#020617,#0f172a,#1d4ed8,#38bdf8);
    background-size:400% 400%;
    animation:bg 15s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.stars{
    position:fixed;
    inset:0;
    background-image:
    radial-gradient(white 1px,transparent 1px);
    background-size:40px 40px;
    opacity:.2;
    animation:stars 60s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0);}
    to{transform:translateY(-500px);}
}

.card{
    position:relative;
    z-index:10;
    width:450px;
    padding:45px;
    border-radius:25px;
    text-align:center;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    0 0 50px rgba(59,130,246,.3);
}

.logo{
    width:110px;
    height:110px;
    margin:auto;

    border-radius:50%;

    background:linear-gradient(135deg,#3b82f6,#06b6d4);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:50px;

    color:white;

    box-shadow:0 0 35px #3b82f6;

    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}

h1{
    margin-top:25px;
    color:white;
    font-size:42px;
}

p{
    color:#dbeafe;
    margin:15px 0 35px;
    font-size:18px;
}

.btn{
    width:100%;
    padding:18px;

    margin:12px 0;

    border:none;
    border-radius:14px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    color:white;

    transition:.3s;
}

.github{
    background:linear-gradient(90deg,#24292e,#3f4348);
}

.projects{
    background:linear-gradient(90deg,#2563eb,#38bdf8);
}

.btn:hover{

    transform:translateY(-6px) scale(1.03);

    box-shadow:0 15px 30px rgba(0,0,0,.4);

}

.footer{
    margin-top:35px;
    color:#bfdbfe;
    font-size:14px;
}

</style>

</head>

<body>

<div class="stars"></div>

<div class="card">

<div class="logo">
🚀
</div>

<h1>My Portfolio</h1>

<p>
Welcome to my personal website
</p>

<button class="btn github" onclick="github()">
🐙 GitHub
</button>

<button class="btn projects" onclick="projects()">
📂 Projects
</button>

<div class="footer">
Made with ❤️
</div>

</div>

<script>

/* ==========================================================
   הכנס כאן את הקישורים שלך בלבד
   ========================================================== */

const GITHUB_URL =
"https://github.com/dashboard";

const PROJECTS_URL =
"https://elroie2000games-crypto.github.io/projects_site/";

/* ========================================================== */

function github(){

window.open(GITHUB_URL,"_blank");

}

function projects(){

window.open(PROJECTS_URL,"_blank");

}

</script>

</body>
</html>
