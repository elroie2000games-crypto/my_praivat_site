<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(-45deg,#0f172a,#1e3a8a,#2563eb,#38bdf8);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* חלקיקים */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background-image:
        radial-gradient(circle,#ffffff55 1px,transparent 1px);
    background-size:40px 40px;
    animation:move 35s linear infinite;
    opacity:.4;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(-200px,-200px);}
}

.card{
    position:relative;
    z-index:1;
    width:450px;
    padding:45px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.logo{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#60a5fa,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    color:white;
    box-shadow:0 0 35px #2563eb;
}

h1{
    margin-top:20px;
    color:white;
    font-size:40px;
}

.subtitle{
    margin-top:10px;
    color:#dbeafe;
    margin-bottom:35px;
}

.button{
    width:100%;
    padding:18px;
    margin:12px 0;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:white;
    font-size:20px;
    font-weight:bold;
    transition:.3s;
}

.button:hover{
    transform:translateY(-6px) scale(1.03);
    box-shadow:0 15px 30px rgba(0,0,0,.35);
}

.github{
    background:linear-gradient(90deg,#24292e,#434b55);
}

.projects{
    background:linear-gradient(90deg,#2563eb,#38bdf8);
}

.footer{
    margin-top:35px;
    color:#bfdbfe;
    font-size:14px;
}
</style>
</head>
<body>

<div class="card">

    <div class="logo">🚀</div>

    <h1>My Portfolio</h1>

    <div class="subtitle">
        Welcome to my personal website.
    </div>

    <button class="button github" onclick="openGithub()">
        🐙 GitHub
    </button>

    <button class="button projects" onclick="openProjects()">
        📂 Projects
    </button>

    <div class="footer">
        Created by Elroie
    </div>

</div>

<script>

//=========================
// הכנס כאן את הקישורים שלך
//=========================

// GitHub
const githubLink = "https://github.com/YOUR_USERNAME";

// Projects
const projectsLink = "https://YOUR-PROJECTS-LINK.com";

//=========================

function openGithub(){
    window.open(githubLink,"_blank");
}

function openProjects(){
    window.open(projectsLink,"_blank");
}

</script>

</body>
</html>
